name: Publicar o app (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Marcar versão
        run: |
          echo "{\"v\":\"${GITHUB_SHA::7}\"}" > site/version.json
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g; s/name=\"alma-versao\" content=\"dev\"/name=\"alma-versao\" content=\"${GITHUB_SHA::7}\"/" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
