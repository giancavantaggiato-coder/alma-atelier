name: Publicar o app (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Empurrão vencido?
        id: prazo
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y%m%d)" -gt 20261205 ]; then echo "parar=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.prazo.outputs.parar != '1'
      - name: Marcar versão
        if: steps.prazo.outputs.parar != '1'
        run: |
          V="${GITHUB_SHA::7}"
          if [ "${{ github.event_name }}" != "push" ]; then V="$V-${{ github.run_number }}"; fi
          echo "{\"v\":\"$V\"}" > site/version.json
          sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g; s/name=\"alma-versao\" content=\"dev\"/name=\"alma-versao\" content=\"${GITHUB_SHA::7}\"/" site/index.html
      - uses: actions/configure-pages@v5
        if: steps.prazo.outputs.parar != '1'
      - uses: actions/upload-pages-artifact@v3
        if: steps.prazo.outputs.parar != '1'
        with:
          path: site
      - id: deploy
        if: steps.prazo.outputs.parar != '1'
        uses: actions/deploy-pages@v4
